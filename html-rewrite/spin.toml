#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "html-rewrite"
version = "0.1.0"
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "HTML Rewrite Example"

[variables]
origin = { default = "https://origin.spin.internal"}

[[trigger.http]]
route = "/"
component = "html-rewrite"

[[trigger.http]]
route = "/origin/..."
component = "origin"

[component.html-rewrite]
source = "target/wasm32-wasip2/release/html_rewrite.wasm"
allowed_outbound_hosts = ["{{ origin }}"]

[component.html-rewrite.variables]
origin = "{{ origin }}"

[component.html-rewrite.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]

[component.origin]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "origin", destination = "/" }]
