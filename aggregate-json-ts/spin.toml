#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "Aggregate JSON from two concurrent upstream requests"
name = "aggregate-json-ts"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "aggregate-json-ts"

[component.aggregate-json-ts]
source = "dist/aggregate-json-ts.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = ["https://swapi.dev"]

[component.aggregate-json-ts.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]
