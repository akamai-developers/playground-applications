#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "aggregate-json-go"
version = "0.1.0"
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "Aggregate JSON from two upstream APIs"

[[trigger.http]]
route = "/..."
component = "aggregate-json-go"

[component.aggregate-json-go]
source = "main.wasm"
allowed_outbound_hosts = ["https://swapi.dev"]

[component.aggregate-json-go.build]
command = "go tool componentize-go build"
watch = ["**/*.go", "go.mod"]
