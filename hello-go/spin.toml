#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "hello-go"
version = "0.1.0"
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "Hello Go"

[[trigger.http]]
route = "/..."
component = "hello-go"

[component.hello-go]
source = "main.wasm"
allowed_outbound_hosts = []
[component.hello-go.build]
command = "go tool componentize-go build"
watch = ["**/*.go", "go.mod"]
