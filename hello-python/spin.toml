#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "Hello Python"
name = "hello-python"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "hello-python"

[component.hello-python]
source = "app.wasm"
[component.hello-python.build]
command = [
  "python3 -m venv .venv",
  ".venv/bin/pip install -q -r requirements.txt",
  ". .venv/bin/activate && componentize-py -w spin:up/http-trigger@4.1.0 componentize app -o app.wasm",
]
watch = ["*.py", "requirements.txt"]
