[package]
name = "hello-rust"
authors = ["Thorsten Hans <thans@akamai.com>"]
description = "A friendly greeter consuming incoming JSON"
version = "0.1.0"
rust-version = "1.93"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spin-sdk = { version = "7.0.0", features = ["json"] }

[workspace]
